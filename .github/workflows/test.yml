name: Test

on:
  push:
    branches: [2.0.x]
  pull_request:
    branches: [2.0.x]
  workflow_dispatch:

jobs:
  test:
    name: Cucumber (webship-js) against a real django CMS site (DDEV)
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout django-cms-steps
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install django-cms-steps dependencies
        run: npm install

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Check the examples and the feature steps against the step regexes
        run: npm run test:examples

      - name: Load every step and feature without a browser
        run: npm run test:dry-run

      - name: Install DDEV
        uses: ddev/github-action-setup-ddev@v1
        with:
          # The DDEV project is in site/, not in the repository root: start it below.
          autostart: 'false'

      - name: Build and start the django CMS site (site/)
        # The first start installs django CMS with its quickstart command
        # (djangocms-versioning, djangocms-alias, djangocms-text,
        # djangocms-frontend, django-filer) and creates the accounts.
        run: npm run site:start

      - name: Wait for the django CMS site
        run: |
          # Plain HTTP: the runner does not trust DDEV's certificate.
          HOSTNAME=$(cd site && ddev exec 'echo $DDEV_HOSTNAME')
          URL="http://${HOSTNAME}"
          echo "LAUNCH_URL=$URL" >> "$GITHUB_ENV"
          npx wait-on -i 5000 -t 600000 "$URL/en/admin/login/"

      - name: Report the versions of the site
        run: cd site && ddev exec '.venv/bin/pip list 2>/dev/null | grep -i -E "^(django|djangocms|django-cms|django-filer)"'

      - name: Run the empty-site lane (the welcome screen, before any page exists)
        env:
          CUCUMBER_TAGS: '@empty-site'
        run: npm test

      - name: Seed the baseline content
        run: npm run site:seed

      - name: Run the django-cms-steps suite
        run: npm test

      - name: Upload the Cucumber report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: cucumber-report
          path: tests/reports/
          if-no-files-found: ignore

      - name: Upload the failure screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: failure-screenshots
          path: screenshots/
          if-no-files-found: ignore

      - name: DDEV logs (on failure)
        if: failure()
        run: cd site && ddev logs
